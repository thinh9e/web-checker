[project]
name = "web-checker"
version = "1.0.0"
description = "The web application that checks a website's SEO score."
authors = [
    { name = "Thinh Nguyen Phuoc", email = "npthinh1996@gmail.com" }
]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django~=5.2.0",
    "lxml~=6.0.0",
    "requests~=2.32.0",
]

[dependency-groups]
dev = [
    "black~=25.12.0",
]
test = [
    "coverage~=7.13.0",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "src/*",
    "*/__init__.py",
    "*/tests.py",
    "manage.py",
]
source = ["."]

[tool.coverage.report]
skip_covered = false
skip_empty = true
